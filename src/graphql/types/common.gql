"""
An address in display order. Lines are never left with gaps, so line2 is only set
if line1 is, and line3 only if line2 is.
"""
type Address {
  line1: String
  line2: String
  line3: String
  city: String
  county: String
  postalCode: String
  country: String
  """
  Unique Property Reference Number. Set when the address was chosen from a
  postcode lookup, null when it was entered manually.
  """
  uprn: String
}

type Email {
  address: String
}

type Phone {
  mobile: String
  landline: String
}

type CodeType {
  code: String
  type: String
}

input EmailInput {
  address: String!
}

input PhoneInput {
  mobile: String
  landline: String
}

"""
A complete address, replacing the stored one. Blank optional fields are saved as null.
"""
input AddressInput {
  line1: String!
  line2: String
  line3: String
  city: String!
  county: String
  postalCode: String!
  country: String!
  """
  Only set this when the address was chosen from a postcode lookup and has not
  been edited since. Leave it out for an address entered manually.
  """
  uprn: String
}
