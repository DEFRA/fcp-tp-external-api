type Business {
  organisationId: String
  sbi: ID!
  info: BusinessInfo
  countyParishHoldings: [CountyParishHolding]

  """
  A customer's relationship with this business, including their permissions.
  """
  customer(crn: ID!): BusinessCustomer
}

type BusinessInfo {
  name: String
  vat: String
  traderNumber: String
  vendorNumber: String
  legalStatus: CodeType
  type: CodeType
  address: Address
  email: Email
  phone: Phone
}

type CountyParishHolding {
  cphNumber: String
}

extend type Mutation {
  """
  Updates any combination of business details in a single request. All fields
  are optional except sbi, so callers need only provide the fields they want
  to change.
  """
  updateBusinessAllFields(input: UpdateBusinessAllFieldsInput!): UpdateBusinessAllFieldsResponse
}

input UpdateBusinessAllFieldsInput {
  sbi: ID!
  name: String
  email: EmailInput
  correspondenceEmail: EmailInput
  phone: PhoneInput
  correspondencePhone: PhoneInput
  address: ValidAddressInput
  correspondenceAddress: ValidAddressInput
  isCorrespondenceAsBusinessAddress: Boolean
  vat: String
  legalStatusCode: Int
  typeCode: Int
  dateStartedFarming: String
  registrationNumbers: BusinessRegistrationNumbersInput
}

input BusinessRegistrationNumbersInput {
  charityCommission: String
  companiesHouse: String
}

type UpdateBusinessAllFieldsResponse {
  success: Boolean
  businessDetailsUpdated: Boolean
  additionalBusinessDetailsUpdated: Boolean
  business: Business
}
