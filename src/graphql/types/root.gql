type Query {
  """
  A business identified by its Single Business Identifier.
  """
  business(sbi: ID!): Business

  """
  A customer identified by their Customer Reference Number.
  """
  customer(crn: ID!): Customer
}

"""
Domain-specific mutation fields are added via "extend type Mutation" in
business.gql and customer.gql - this stub field exists only so the base type
has something to extend.
"""
type Mutation {
  _empty: Boolean
}
