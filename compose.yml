services:
  # Local stand-in for the real data access layer. When deployed, DAL_ENDPOINT
  # points at the hosted fcp-dal-api instead and none of these run.
  mongodb:
    image: mongo:7
    ports:
      - '27017:27017'
    networks:
      - fcp-tp-external-api
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 3s
      timeout: 2s
      retries: 5

  dal-mock:
    image: defradigital/fcp-dal-upstream-services-mock
    ports:
      - '3100:3100'
    environment:
      LOG_LEVEL: info
      NODE_ENV: development
      PORT: 3100
    networks:
      - fcp-tp-external-api
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3100/health']
      interval: 3s
      timeout: 2s
      retries: 5

  fcp-dal-api:
    image: defradigital/fcp-dal-api
    ports:
      - '3005:3000'
    environment:
      LOG_LEVEL: info
      NODE_ENV: development
      PORT: 3000
      ENVIRONMENT: dev
      DISABLE_AUTH: true
      DISABLE_PROXY: true
      GRAPHQL_DASHBOARD_ENABLED: true
      ADMIN_AD_GROUP_ID: unused
      KITS_INTERNAL_GATEWAY_URL: http://dal-mock:3100/extapi/
      KITS_EXTERNAL_GATEWAY_URL: http://dal-mock:3100/extapi/
      KITS_GATEWAY_TIMEOUT_MS: 3000
      KITS_DISABLE_MTLS: true
      KITS_DAL_SERVICE_ACCOUNT_EMAIL: test@example.com
      HITACHI_BASE_URL: http://dal-mock:3100/api/
      HITACHI_TIMEOUT_MS: 3000
      HITACHI_DISABLE_AUTH: true
      DAL_REQUEST_TIMEOUT_MS: 3000
      KIT_EXT_PERSON_ID_OVERRIDE: 3337243
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DATABASE: 'fcp-dal-api'
      SERVICE_VERSION: 0.0.0
      # Set DAL_AUDIT_SNS_TOPIC_ARN (with the audit profile) to see the DAL's events next to ours
      AUDIT_SNS_TOPIC_ARN: ${DAL_AUDIT_SNS_TOPIC_ARN:-}
      AWS_REGION: eu-west-2
      AWS_ENDPOINT_URL_SNS: http://floci:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      mongodb:
        condition: service_healthy
      dal-mock:
        condition: service_healthy
    networks:
      - fcp-tp-external-api
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 3s
      timeout: 2s
      retries: 5

  ################################################################################

  # Local AWS emulator for audit events. Only under the `audit` profile.
  floci:
    profiles:
      - audit
    image: hectorvent/floci:latest
    ports:
      - '4566:4566'
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_DEFAULT_REGION: eu-west-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    networks:
      - fcp-tp-external-api

  floci-init:
    profiles:
      - audit
    image: amazon/aws-cli
    entrypoint: /bin/sh
    command: /setup/init.sh
    depends_on:
      floci:
        condition: service_started
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_REGION: eu-west-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - ./floci/init.sh:/setup/init.sh
    networks:
      - fcp-tp-external-api

  ################################################################################

  fcp-tp-external-api:
    profiles:
      - app
    build:
      context: .
      target: development
    ports:
      - '3001:3001'
      - '9001:9229'
    depends_on:
      fcp-dal-api:
        condition: service_healthy
    environment:
      PORT: 3001
      NODE_ENV: development
      AWS_EMF_ENVIRONMENT: Local
      DAL_ENDPOINT: http://fcp-dal-api:3000/graphql
      DAL_GATEWAY_TYPE: external
      DAL_DISABLE_AUTH: 'true'
      SANITIZE_DATA: 'true'
      SANITIZE_SECRET: local-sanitize-secret-change-me
      RESTRICT_CRNS: 'false'
      GRAPHQL_INTROSPECTION_ENABLED: 'true'
      AUDIT_ENABLED: ${AUDIT_ENABLED:-false}
      AUDIT_SNS_TOPIC_ARN: ${AUDIT_SNS_TOPIC_ARN:-}
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    networks:
      - fcp-tp-external-api
    volumes:
      - ./src:/home/node/src
      - ./package.json:/home/node/package.json

################################################################################

networks:
  fcp-tp-external-api:
    driver: bridge
    name: fcp-tp-external-api
